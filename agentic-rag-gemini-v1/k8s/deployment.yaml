apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-rag
  labels:
    app: agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-rag
  template:
    metadata:
      labels:
        app: agentic-rag
    spec:
      containers:
        - name: agentic-rag
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/agentic-rag:v1
          ports:
            - containerPort: 8501
          env:
            - name: GEMINI_MODEL
              value: gemini-3.7-flash
          envFrom:
            - secretRef:
                name: agentic-rag-secrets
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
